<!DOCTYPE html>

          <a class="tome" href="/book/llm/01-architecture/">

              <div class="tome__body">

            <article class="tome__card">
              <div class="tome__art">
                <img src="/assets/book/vol2.jpeg" alt="" width="1200" height="896" loading="lazy" />

              <div class="tome__body">

                <p class="tome__blurb">SFT · 蒸馏 · 强化学习</p>
